<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netlify Forms</title>
</head>
<body>
<form name="contact" netlify netlify-honeypot="bot-field" hidden>
    <input name="bot-field" type="hidden" />
    <input name="form-name" value="contact" type="hidden" />
    <input name="name" type="text" />
    <input name="email" type="email" />
    <input name="package" type="text" />
    <input name="date" type="date" />
    <input name="time" type="text" />
    <input name="message" type="textarea" />
</form>
<form name="package-booking" netlify netlify-honeypot="bot-field" hidden>
  <input name="form-name" value="package-booking" type="hidden" />
  <input name="bot-field" type="hidden" />
  <input name="category" type="text" />
  <input name="packageName" type="text" />
  <input name="variant" type="text" />
  <input name="variantPrice" type="number" />
  <input name="addons" type="text" />
  <input name="addonsTotal" type="number" />
  <input name="estimatedTotal" type="number" />
  <input name="name" type="text" />
  <input name="hotel" type="text" />
  <input name="phone" type="text" />
  <input name="email" type="email" />
  <input name="date" type="date" />
  <input name="notes" type="textarea" />
</form>

</body>
</html>
